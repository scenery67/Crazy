name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 밀린 실행은 최신 것만 남긴다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 시뮬레이션이 깨진 채로 배포되지 않게 막는다
      - run: npm run typecheck
      - run: npm test

      # 프로젝트 페이지는 /<저장소이름>/ 아래에 놓이므로 base를 맞춰야
      # 에셋 경로가 깨지지 않는다. 사용자/조직 페이지(<id>.github.io)라면 "/"로 바꾼다
      - name: Build
        working-directory: packages/client
        run: npx vite build --base="/${GITHUB_REPOSITORY#*/}/"

      # 개인용 스프라이트는 gitignore돼 있어 CI 체크아웃에 애초에 없다.
      # 그래도 배포물에 저작권 자산이 섞이는 사고는 되돌릴 수 없으므로 한 번 더 지운다
      - name: 개인용 스프라이트 제거 (이중 안전장치)
        run: rm -rf packages/client/dist/sprites

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
