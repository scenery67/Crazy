<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>크레이지 아케이드</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: grid;
        place-items: center;
        gap: 12px;
        grid-auto-rows: min-content;
        align-content: center;
        background: #0e1420;
        color: #cbd5e1;
        font: 13px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace;
      }
      canvas {
        display: block;
        border-radius: 8px;
        box-shadow: 0 12px 40px rgb(0 0 0 / 0.5);
        max-width: 100%;
        height: auto;
        image-rendering: pixelated;
      }
      #hud {
        display: flex;
        gap: 16px;
        opacity: 0.75;
      }
      #hud b {
        color: #e2e8f0;
        font-weight: 600;
      }
      #stats {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        justify-content: center;
      }
      #stats .p {
        display: flex;
        gap: 8px;
        align-items: baseline;
        padding: 4px 10px;
        border-radius: 6px;
        background: rgb(255 255 255 / 0.04);
      }
      #stats .name {
        font-weight: 700;
      }
      #stats .dead {
        opacity: 0.35;
        text-decoration: line-through;
      }
      #stats .fx {
        color: #ffd166;
      }
      #stats .team {
        padding: 0 5px;
        border-radius: 4px;
        background: rgb(255 255 255 / 0.1);
        font-weight: 700;
      }
      #setup {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
      }
      #setup .group {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      #setup label {
        opacity: 0.6;
        margin-right: 4px;
      }
      #setup button {
        font: inherit;
        color: #cbd5e1;
        background: rgb(255 255 255 / 0.06);
        border: 1px solid transparent;
        border-radius: 5px;
        padding: 3px 10px;
        cursor: pointer;
      }
      #setup button:hover {
        background: rgb(255 255 255 / 0.12);
      }
      #setup.locked {
        opacity: 0.35;
        pointer-events: none;
      }
      #net {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      #net label {
        opacity: 0.6;
      }
      #net #room {
        width: 90px;
        text-transform: uppercase;
      }
      #net input {
        font: inherit;
        width: 220px;
        color: #cbd5e1;
        background: rgb(255 255 255 / 0.06);
        border: 1px solid rgb(255 255 255 / 0.12);
        border-radius: 5px;
        padding: 3px 8px;
      }
      #net button {
        font: inherit;
        color: #cbd5e1;
        background: rgb(255 255 255 / 0.06);
        border: 1px solid transparent;
        border-radius: 5px;
        padding: 3px 12px;
        cursor: pointer;
      }
      #net button:hover {
        background: rgb(255 255 255 / 0.12);
      }
      #netstatus {
        opacity: 0.8;
      }
      #netstatus.ok {
        color: #8ae8b4;
      }
      #netstatus.bad {
        color: #ff8a8a;
      }
      #setup button[aria-pressed='true'] {
        color: #0e1420;
        background: #8ac4ff;
        border-color: #8ac4ff;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="setup">
      <span class="group" data-key="mode">
        <label>모드</label>
        <button type="button" data-value="solo">개인전</button>
        <button type="button" data-value="duo">2v2</button>
      </span>
      <span class="group" data-key="local">
        <label>사람</label>
        <button type="button" data-value="1">1인</button>
        <button type="button" data-value="2">2인</button>
      </span>
      <span class="group" data-key="difficulty">
        <label>봇</label>
        <button type="button" data-value="easy">쉬움</button>
        <button type="button" data-value="normal">보통</button>
        <button type="button" data-value="hard">어려움</button>
      </span>
    </div>
    <div id="net">
      <label for="server">온라인</label>
      <input id="server" type="text" spellcheck="false" placeholder="ws://주소:8080" />
      <input id="room" type="text" spellcheck="false" maxlength="8" placeholder="방 코드" />
      <button id="connect" type="button">접속</button>
      <span id="netstatus"></span>
      <label for="savereplay">리플레이</label>
      <button id="savereplay" type="button">저장</button>
      <button id="loadreplay" type="button">열기</button>
      <input id="replayfile" type="file" accept="application/json,.json" hidden />
      <span id="replaystatus"></span>
    </div>
    <canvas id="game"></canvas>
    <div id="stats"></div>
    <div id="hud">
      <span>tick <b id="tick">0</b></span>
      <span>fps <b id="fps">0</b></span>
      <span>생존 <b id="alive">4</b></span>
      <span>서든데스 <b id="phase">-</b></span>
      <span id="corrbox" hidden>보정 <b id="corr">0</b></span>
      <span>seed <b id="seed">-</b></span>
      <span><b>방향키 + Space</b> 1P</span>
      <span><b>WASD + F</b> 2P</span>
      <span><b>1/2</b> 사람 수</span>
      <span><b>R</b> 새 판</span>
      <span>소리 <b id="mute">켜짐</b> (<b>M</b>)</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
